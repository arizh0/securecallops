name: CI and AWS Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt -r requirements-dev.txt

      - name: Check Python syntax
        run: python -m compileall app scripts

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

      - name: Build Docker image
        run: docker build -t securecallops:${{ github.sha }} .

  deploy-aws:
    name: Deploy to AWS
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.AWS_ROLE_TO_ASSUME != ''

    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push image to ECR
        id: build-image
        run: |
          IMAGE_URI="${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}"
          docker build -t "$IMAGE_URI" .
          docker push "$IMAGE_URI"
          echo "image=$IMAGE_URI" >> "$GITHUB_OUTPUT"

      - name: Deploy caller service
        run: |
          IMAGE_URI="${{ steps.build-image.outputs.image }}"
          TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition "${{ vars.CALLER_TASK_DEFINITION }}" \
            --query 'taskDefinition' --output json \
            | jq --arg img "$IMAGE_URI" \
              'del(.taskDefinitionArn,.revision,.status,.requiresAttributes,
                   .placementConstraints,.compatibilities,.registeredAt,.registeredBy)
               | .containerDefinitions[0].image = $img')
          NEW_ARN=$(aws ecs register-task-definition \
            --cli-input-json "$TASK_DEF" \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          aws ecs update-service \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --service "${{ vars.ECS_CALLER_SERVICE }}" \
            --task-definition "$NEW_ARN"

      - name: Deploy admin service
        run: |
          IMAGE_URI="${{ steps.build-image.outputs.image }}"
          TASK_DEF=$(aws ecs describe-task-definition \
            --task-definition "${{ vars.ADMIN_TASK_DEFINITION }}" \
            --query 'taskDefinition' --output json \
            | jq --arg img "$IMAGE_URI" \
              'del(.taskDefinitionArn,.revision,.status,.requiresAttributes,
                   .placementConstraints,.compatibilities,.registeredAt,.registeredBy)
               | .containerDefinitions[0].image = $img')
          NEW_ARN=$(aws ecs register-task-definition \
            --cli-input-json "$TASK_DEF" \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          aws ecs update-service \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --service "${{ vars.ECS_ADMIN_SERVICE }}" \
            --task-definition "$NEW_ARN"

      - name: Wait for ECS services
        run: |
          aws ecs wait services-stable \
            --cluster "${{ vars.ECS_CLUSTER }}" \
            --services "${{ vars.ECS_CALLER_SERVICE }}" "${{ vars.ECS_ADMIN_SERVICE }}"
