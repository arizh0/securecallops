apiVersion: v1
kind: Namespace
metadata:
  name: securecallops
---
apiVersion: v1
kind: Service
metadata:
  name: caller
  namespace: securecallops
spec:
  type: ClusterIP
  selector:
    app: securecallops
    component: caller
  ports:
    - name: http
      port: 80
      targetPort: 8001
---
apiVersion: v1
kind: Service
metadata:
  name: admin
  namespace: securecallops
spec:
  type: ClusterIP
  selector:
    app: securecallops
    component: admin
  ports:
    - name: http
      port: 80
      targetPort: 8002
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: caller
  namespace: securecallops
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: securecallops
      component: caller
  template:
    metadata:
      labels:
        app: securecallops
        component: caller
    spec:
      serviceAccountName: securecallops-runtime
      containers:
        - name: caller
          image: IMAGE_REPLACE_ME
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8001
          envFrom:
            - configMapRef:
                name: securecallops-config
            - secretRef:
                name: securecallops-secrets
          env:
            - name: APP_MODULE
              value: app.phonebanking.main:app
            - name: PORT
              value: "8001"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8001
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8001
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
          securityContext:
            runAsUser: 1000
            runAsNonRoot: true
            allowPrivilegeEscalation: false
        - name: cloud-sql-proxy
          image: gcr.io/cloud-sql-connectors/cloud-sql-proxy:2.21.0
          args:
            - "--private-ip"
            - "--structured-logs"
            - "--port=5432"
            - "INSTANCE_CONNECTION_NAME_REPLACE_ME"
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
---
